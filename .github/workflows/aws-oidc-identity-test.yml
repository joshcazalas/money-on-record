name: Reject obsolete AWS OIDC workflow

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-oidc-obsolete-path-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reject-obsolete-workflow:
    name: Obsolete workflow cannot assume any hub role
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UAT_ARTIFACT_PUBLISH_ROLE_ARN: arn:aws:iam::${{ vars.AWS_DEPLOYMENT_ACCOUNT_ID }}:role/MoneyOnRecordArtifactPublishUat
      PRODUCTION_DEPLOY_ROLE_ARN: arn:aws:iam::${{ vars.AWS_DEPLOYMENT_ACCOUNT_ID }}:role/MoneyOnRecordDeployProd
      PRODUCTION_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN_PRODUCTION }}
      UAT_DEPLOY_ROLE_ARN: arn:aws:iam::${{ vars.AWS_DEPLOYMENT_ACCOUNT_ID }}:role/MoneyOnRecordDeployUat
      UAT_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN_UAT }}
    steps:
      - name: Verify all hub roles reject this workflow path
        run: |
          set -euo pipefail
          expected_prefix="arn:aws:iam::245459924498:role/MoneyOnRecord"
          for role_arn in \
            "$UAT_ARTIFACT_PUBLISH_ROLE_ARN" \
            "$UAT_PLAN_ROLE_ARN" \
            "$PRODUCTION_PLAN_ROLE_ARN" \
            "$UAT_DEPLOY_ROLE_ARN" \
            "$PRODUCTION_DEPLOY_ROLE_ARN"; do
            if [[ "$role_arn" != "$expected_prefix"* ]]; then
              echo "::error::A configured hub role does not match the reviewed deployment account."
              exit 1
            fi
          done

          oidc_response="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          )"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"

          assert_denied() {
            local role_arn="$1"
            local label="$2"
            local denial_output
            local status

            set +e
            denial_output="$(
              aws sts assume-role-with-web-identity \
                --role-arn "$role_arn" \
                --role-session-name "mor-obsolete-deny-${GITHUB_RUN_ID}" \
                --web-identity-token "$oidc_token" \
                --duration-seconds 900 \
                --query AssumedRoleUser.Arn \
                --output text 2>&1
            )"
            status=$?
            set -e

            if [[ "$status" -eq 0 ]]; then
              echo "::error::The obsolete workflow unexpectedly assumed the $label hub role."
              exit 1
            fi
            if ! grep -Eiq 'AccessDenied|not authorized.*AssumeRoleWithWebIdentity' <<<"$denial_output"; then
              echo "::error::The $label denial probe failed for an unexpected reason."
              printf '%s\n' "$denial_output"
              exit 1
            fi
            echo "The $label hub role correctly rejected this workflow path."
          }

          assert_denied "$UAT_PLAN_ROLE_ARN" uat-plan
          assert_denied "$UAT_ARTIFACT_PUBLISH_ROLE_ARN" uat-artifact-publish
          assert_denied "$PRODUCTION_PLAN_ROLE_ARN" production-plan
          assert_denied "$UAT_DEPLOY_ROLE_ARN" uat-deploy
          assert_denied "$PRODUCTION_DEPLOY_ROLE_ARN" production-deploy
          unset oidc_token oidc_response
