name: PR release label

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

jobs:
  release-label:
    name: Exactly one major, minor, or patch label
    runs-on: ubuntu-latest
    steps:
      - name: Validate release intent
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          count="$(jq '[.[] | select(. == "major" or . == "minor" or . == "patch")] | length' <<<"$PR_LABELS")"
          if [[ "$count" -ne 1 ]]; then
            echo "Every PR must have exactly one release label: major, minor, or patch. Found: $count"
            exit 1
          fi
          echo "Release label is valid."
