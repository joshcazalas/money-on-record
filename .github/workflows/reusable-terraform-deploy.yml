name: Reusable environment deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Environment to deploy.
        required: true
        type: string
      revision:
        description: Exact commit SHA to deploy.
        required: true
        type: string
      release_tag:
        description: Immutable semantic-version release required for production.
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: terraform-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_HUB_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      DEPLOY_REVISION: ${{ inputs.revision }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
      TF_WORKSPACE: ${{ inputs.environment }}
      TF_VAR_aws_workload_role_arn: ${{ vars.AWS_WORKLOAD_ROLE_ARN }}
      TF_VAR_site_artifact_directory: ../../../build/site
    steps:
      - name: Validate deployment request
        env:
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_REPOSITORY: ${{ github.repository }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          [[ "$CALLER_REPOSITORY" == "joshcazalas/money-on-record" ]]
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]]

          case "$REQUESTED_ENVIRONMENT" in
            uat)
              [[ "$CALLER_EVENT" == "push" || "$CALLER_EVENT" == "workflow_dispatch" ]]
              [[ -z "$RELEASE_TAG" ]]
              ;;
            production)
              [[ "$CALLER_EVENT" == "workflow_dispatch" ]]
              [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
              ;;
            *)
              echo "::error::environment must be uat or production."
              exit 1
              ;;
          esac

      - name: Check out deployment revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.revision }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Prepare site artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$TF_WORKSPACE" == "production" ]]; then
            release_version="${RELEASE_TAG#v}"
            release_directory="$RUNNER_TEMP/release-site"
            archive="$release_directory/money-on-record-site-${release_version}.zip"
            mkdir -p "$release_directory"
            gh release download "$RELEASE_TAG" \
              --pattern "money-on-record-site-${release_version}.zip" \
              --pattern "money-on-record-site-${release_version}.zip.sha256" \
              --pattern "provenance.sigstore.json" \
              --dir "$release_directory"
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$release_directory/provenance.sigstore.json"
            uv run --locked mor-l0 verify-site \
              --archive "$archive" \
              --expected-sha256 "$(cut -d ' ' -f 1 "${archive}.sha256")" \
              --output build/site
          else
            uv run --locked mor-l0 build-site
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Assume environment deployment role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_HUB_ROLE_ARN }}
          role-session-name: mor-${{ inputs.environment }}-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          allowed-account-ids: ${{ vars.AWS_DEPLOYMENT_ACCOUNT_ID }}

      - name: Initialize Terraform
        working-directory: infra/components/static-site
        run: >-
          terraform init
          -input=false
          -lockfile=readonly
          -no-color

      - name: Plan deployment
        working-directory: infra/components/static-site
        run: >-
          terraform plan
          -input=false
          -lock-timeout=5m
          -no-color
          -out="$RUNNER_TEMP/money-on-record-${TF_WORKSPACE}.tfplan"

      - name: Apply deployment
        working-directory: infra/components/static-site
        run: >-
          terraform apply
          -input=false
          -no-color
          "$RUNNER_TEMP/money-on-record-${TF_WORKSPACE}.tfplan"
