name: Reusable Terraform plan

on:
  workflow_call:
    inputs:
      environment:
        description: Environment to plan.
        required: true
        type: string

permissions: {}

jobs:
  build-site:
    name: Build site (${{ inputs.environment }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_digest: ${{ steps.build.outputs.artifact_digest }}
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    steps:
      - name: Check out pull-request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build proposed site
        id: build
        run: |
          set -euo pipefail
          uv run --locked mor-l0 build-site
          artifact_digest="$(cut -d ' ' -f 1 build/money-on-record-site.zip.sha256)"
          artifact_name="terraform-site-${{ inputs.environment }}-${GITHUB_SHA}"
          echo "artifact_digest=$artifact_digest" >>"$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >>"$GITHUB_OUTPUT"

      - name: Upload proposed site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: |
            build/money-on-record-site.zip
            build/money-on-record-site.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  plan:
    name: Terraform plan (${{ inputs.environment }})
    needs: build-site
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PLAN_HUB_ROLE_ARN: ${{ inputs.environment == 'uat' && vars.AWS_PLAN_ROLE_ARN_UAT || vars.AWS_PLAN_ROLE_ARN_PRODUCTION }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      STATE_KEY: money-on-record/static-site/${{ inputs.environment }}/terraform.tfstate
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
      TF_WORKSPACE: ${{ inputs.environment }}
      TF_VAR_aws_workload_role_arn: ${{ inputs.environment == 'uat' && vars.AWS_WORKLOAD_PLAN_ROLE_ARN_UAT || vars.AWS_WORKLOAD_PLAN_ROLE_ARN_PRODUCTION }}
      TF_VAR_site_artifact_directory: ../../../build/site
    steps:
      - name: Validate plan request
        env:
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_ENVIRONMENT" == "uat" || "$REQUESTED_ENVIRONMENT" == "production" ]]
          [[ "$CALLER_EVENT" == "pull_request" ]]
          [[ "$CALLER_REPOSITORY" == "$TARGET_REPOSITORY" ]]

      - name: Check out pull-request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          persist-credentials: false

      - name: Check out trusted planning code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Download proposed site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-site.outputs.artifact_name }}
          path: site-artifact

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: trusted/uv.lock

      - name: Verify proposed site with trusted code
        env:
          ARTIFACT_DIGEST: ${{ needs.build-site.outputs.artifact_digest }}
        run: >-
          uv run --project trusted --locked mor-l0 verify-site
          --archive "$GITHUB_WORKSPACE/site-artifact/money-on-record-site.zip"
          --expected-sha256 "$ARTIFACT_DIGEST"
          --output "$GITHUB_WORKSPACE/source/build/site"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Assume environment plan role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.PLAN_HUB_ROLE_ARN }}
          role-session-name: mor-${{ inputs.environment }}-plan-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_DEPLOYMENT_ACCOUNT_ID }}

      - name: Detect existing workspace state
        id: state
        run: |
          set -euo pipefail
          set +e
          state_probe="$(aws s3api head-object --bucket "$STATE_BUCKET" --key "$STATE_KEY" 2>&1)"
          state_status=$?
          set -e

          if [[ "$state_status" -eq 0 ]]; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
          elif grep -Eq '\(404\)|Not Found|NoSuchKey' <<<"$state_probe"; then
            echo "exists=false" >>"$GITHUB_OUTPUT"
          else
            printf '%s\n' "$state_probe" >&2
            exit "$state_status"
          fi

      - name: Run Terraform plan
        run: >-
          bash "$GITHUB_WORKSPACE/trusted/scripts/run-terraform-plan.sh"
          "$GITHUB_WORKSPACE/source"
          "${{ inputs.environment }}"
          "${{ steps.state.outputs.exists }}"
          "$GITHUB_WORKSPACE/plan-result"

      - name: Upload sanitized plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: plan-result
          if-no-files-found: error
          retention-days: 7
