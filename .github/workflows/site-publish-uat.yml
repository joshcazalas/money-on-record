name: Publish site artifact to UAT

run-name: Publish UAT site from ${{ github.sha }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      confirm_uat_publication:
        description: Build and publish the exact current main site artifact to UAT.
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: site-publish-uat-entry
  cancel-in-progress: false

jobs:
  build:
    name: Build reviewed site artifact
    if: inputs.confirm_uat_publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_digest: ${{ steps.build.outputs.artifact_digest }}
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify exact revision
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Test and build deterministic site
        id: build
        run: |
          set -euo pipefail
          uv run --locked pytest tests/test_site.py
          uv run --locked mor-l0 build-site

          artifact_digest="$(cut -d ' ' -f 1 build/money-on-record-site.zip.sha256)"
          [[ "$artifact_digest" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::The site builder returned an invalid SHA-256 digest."
            exit 1
          }
          echo "artifact_digest=$artifact_digest" >>"$GITHUB_OUTPUT"
          echo "artifact_name=money-on-record-site-${GITHUB_SHA}" >>"$GITHUB_OUTPUT"

      - name: Pass the exact artifact to the trusted publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: |
            build/money-on-record-site.zip
            build/money-on-record-site.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish reviewed artifact to UAT
    needs: build
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: joshcazalas/money-on-record/.github/workflows/reusable-site-publish.yml@main
    with:
      revision: ${{ github.sha }}
      artifact_name: ${{ needs.build.outputs.artifact_name }}
      artifact_digest: ${{ needs.build.outputs.artifact_digest }}
