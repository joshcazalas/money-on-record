name: Apply merged Terraform configuration

on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: terraform-apply-main
  cancel-in-progress: false

jobs:
  reviewed-plan:
    name: Verify reviewed Terraform plan
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Verify the sticky plan belongs to the merged revision
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          comments="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/comments")"
          comment="$(
            jq -er '
              [
                .[][]
                | select(.user.login == "github-actions[bot]")
                | select(.body | startswith("<!-- money-on-record-terraform-plan -->"))
              ]
              | last
              | .body
            ' <<<"$comments"
          )"
          plan_run_id="$(grep -oE '/actions/runs/[0-9]+' <<<"$comment" | tail -n 1 | cut -d/ -f4)"
          [[ "$plan_run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::The sticky Terraform plan does not identify its workflow run."; exit 1;
          }

          plan_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$plan_run_id")"
          jq -e \
            --arg head_sha "$HEAD_SHA" \
            --argjson pull_request_number "$PULL_REQUEST_NUMBER" \
            '
              .event == "pull_request"
              and .path == ".github/workflows/terraform-plan.yml"
              and .head_sha == $head_sha
              and any(.pull_requests[]?; .number == $pull_request_number)
              and .status == "completed"
              and .conclusion == "success"
            ' <<<"$plan_run" >/dev/null || {
              echo "::error::The merged revision has no successful trusted Terraform plan."; exit 1;
            }

  apply-uat:
    name: Apply Terraform to UAT
    needs: reviewed-plan
    permissions:
      contents: read
      id-token: write
    uses: joshcazalas/money-on-record/.github/workflows/reusable-terraform-deploy.yml@main
    with:
      environment: uat

  apply-production:
    name: Apply Terraform to production
    needs: [reviewed-plan, apply-uat]
    permissions:
      contents: read
      id-token: write
    uses: joshcazalas/money-on-record/.github/workflows/reusable-terraform-deploy.yml@main
    with:
      environment: production
