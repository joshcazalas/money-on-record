name: Deploy Terraform to UAT

run-name: Deploy Terraform to UAT from ${{ github.sha }} by @${{ github.actor }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_uat_deployment:
        description: Confirm an intentional recovery deployment of current main to UAT.
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  deploy-uat:
    name: Deploy Terraform to UAT
    if: github.event_name == 'push' || inputs.confirm_uat_deployment
    permissions:
      contents: read
      id-token: write
    uses: joshcazalas/money-on-record/.github/workflows/reusable-terraform-deploy.yml@main
    with:
      environment: uat
      revision: ${{ github.sha }}
