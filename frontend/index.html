<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
    <meta name="description" content="Browse Austin campaign contributions and city payment records. Filter records, download CSV files, and inspect the original sources.">
    <title>Campaign contributions · Money on Record</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
    <script type="module" src="./dev-reload.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to records</a>
    <div class="utility-bar">
      <div class="shell utility-inner"><span>Public records <span class="utility-divider">/</span> Austin, Texas</span><span class="local-label">Local preview</span></div>
    </div>
    <header class="site-header">
      <div class="shell masthead">
        <a class="brand" href="#/contributions" aria-label="Money on Record home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>Money on Record</a>
        <a class="repository-link" href="https://github.com/joshcazalas/money-on-record" target="_blank" rel="noreferrer">Source code <span aria-hidden="true">↗</span></a>
      </div>
      <nav class="shell primary-nav" aria-label="Main navigation">
        <a href="#/contributions" data-page="contributions">Contributions</a>
        <a href="#/payments" data-page="payments">City payments</a>
        <a href="#/sources" data-page="sources">Sources &amp; downloads</a>
        <a href="#/about" data-page="about">About the data</a>
      </nav>
    </header>
    <main id="content" class="shell" tabindex="-1">
      <div id="app"><h1>Campaign contributions</h1><p class="loading" role="status">Loading records…</p></div>
      <noscript><p>This record browser needs JavaScript. The original datasets are available on the <a href="https://data.austintexas.gov/" rel="noreferrer">City of Austin open data portal</a>.</p></noscript>
    </main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>Money on Record <span class="footer-divider">/</span> Austin public records</p>
        <div><a href="#/sources">Data sources</a><a href="#/about">Coverage &amp; methods</a><a href="https://github.com/joshcazalas/money-on-record" target="_blank" rel="noreferrer">GitHub ↗</a></div>
      </div>
    </footer>
    <dialog id="record-dialog" aria-labelledby="record-title">
      <div class="dialog-top"><span>Record detail</span><form method="dialog"><button class="icon-button" aria-label="Close record details">×</button></form></div>
      <div id="record-detail"></div>
    </dialog>
  </body>
</html>
